<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <header class="login-header">
                <h1>Iniciar Sesión</h1>
                <p class="subtitle">Accede al sistema de administración</p>
            </header>

            <form id="login-form" class="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                        autofocus
                        placeholder="Ingresa tu usuario"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        placeholder="Ingresa tu contraseña"
                    >
                </div>

                <div id="attempts-info" class="attempts-info hidden" aria-live="polite">
                    <span id="attempts-text"></span>
                </div>

                <div id="lockout-info" class="lockout-info hidden" aria-live="assertive">
                    <span id="lockout-text"></span>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary">
                    <span class="btn-text">Iniciar sesión</span>
                    <span class="btn-loader hidden"></span>
                </button>
            </form>

            <footer class="login-footer">
                <img src="imgs/logo.jpg" alt="Logo de la empresa" class="logo" id="logo-img">
                <p class="copyright">© 2026 Sistema de Administración</p>
            </footer>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
