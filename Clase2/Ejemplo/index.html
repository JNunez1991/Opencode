<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Diario de Estudio</h1>
        </header>

        <section class="streak-section">
            <div class="streak-card">
                <span class="streak-fire" aria-hidden="true">🔥</span>
                <div class="streak-info">
                    <span class="streak-number" id="streakNumber">0</span>
                    <span class="streak-label">días seguidos</span>
                    <div class="streak-meta">
                        <div class="streak-stat">
                            <span class="streak-stat-value" id="streakTotal">0h 0min</span>
                            <span class="streak-stat-label">Total</span>
                        </div>
                        <div class="streak-stat">
                            <span class="streak-stat-value" id="streakMonth">0</span>
                            <span class="streak-stat-label">Días este mes</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h2>Registrar sesión</h2>
            <form id="sessionForm">
                <div class="form-group">
                    <label for="date">Fecha</label>
                    <input type="date" id="date" name="date" required max="">
                </div>
                <div class="form-group">
                    <label for="topic">Tema</label>
                    <input type="text" id="topic" name="topic" placeholder="Ej: JavaScript, React, Algoritmos..." required>
                </div>
                <div class="form-group">
                    <label for="minutes">Minutos</label>
                    <input type="number" id="minutes" name="minutes" min="1" placeholder="Ej: 45" required>
                </div>
                <button type="submit" class="btn-primary">Guardar sesión</button>
            </form>
        </section>

        <section class="sessions-section">
            <h2>Sesiones registradas</h2>
            <ul id="sessionsList" class="sessions-list"></ul>
            <p id="emptyMessage" class="empty-message" hidden>No hay sesiones aún. ¡Registra tu primera sesión!</p>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
